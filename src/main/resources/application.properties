spring.application.name=ussd772-api
server.port=${SERVER_PORT:8081}

ussd.api-key=${USSD_API_KEY:}
ussd.allowed-ips=${USSD_ALLOWED_IPS:}
ussd.trusted-proxies=${USSD_TRUSTED_PROXIES:}

spring.datasource.url=jdbc:mysql://localhost:3306/ussd772?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}
admin.jwt-secret=${ADMIN_JWT_SECRET:}
admin.jwt-expiration-hours=${ADMIN_JWT_EXPIRATION_HOURS:10}
admin.allowed-ips=${ADMIN_ALLOWED_IPS:}

server.ssl.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
